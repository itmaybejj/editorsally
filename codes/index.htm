<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <!-- Static fallback for crawlers and no-JS clients: license in English. -->
  <link rel="canonical" href="https://editoria11y.com/license/">
  <meta http-equiv="refresh" content="0;url=/license/">
</head>

<body>
  <p>Redirecting to <a href="/license/">the licensing page</a>…</p>
  <script src="/assets/lang/i18n.js?v=9063c00b"></script>
  <script>
    // Short-URL entry point (used in QR codes / print). Optionally picks
    // a translated destination from the browser's language preferences;
    // otherwise falls back to the English page.
    (() => {
      const i18n = (typeof defined_i18n !== 'undefined') ? defined_i18n : null;
      const params = new URLSearchParams(window.location.search);
      const requested = params.get('p');
      const validPages = i18n ? i18n.canonicalPaths : [];
      const page = (requested && validPages.includes(requested)) ? requested : 'license';
      let lang = 'en';
      if (i18n) {
        const preferred = (navigator.languages || []).find(l => i18n.allLanguages.includes(l));
        if (preferred) lang = preferred;
      }
      const target = i18n ? i18n.buildPath(lang, page) : `/${page}/`;
      window.location.replace(target);
    })();
  </script>
</body>

</html>
