<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="refresh" content="0;url=/en/license/">
  <meta name="robots" content="noindex">
  <title>Redirecting…</title>
  <link rel="canonical" href="https://editoria11y.com/en/license/">
</head>

<body>
  <p>Redirecting to <a href="/en/license/">the licensing page</a>…</p>
  <script src="/assets/lang/i18n.js"></script>
  <script>
    const i18n = (typeof defined_i18n !== 'undefined') ? defined_i18n : null;
    if (i18n) {
      const match = (navigator.languages || []).find(l => i18n.supportedLanguages.includes(l));
      if (match) window.location.replace(i18n.buildPath(match, 'license'));
    }
  </script>
</body>

</html>
